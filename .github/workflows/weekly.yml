name: Weekly draft
# Monday 07:00 UTC: build the digest, save drafts/DATE.html, email the owner only.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m digest.main draft
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      - name: Commit draft and logs
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add drafts logs
          git commit -m "Draft $(date -u +%F)" || echo "nothing to commit"
          git push
